<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Carros POO + Dinâmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5 text-center">
        
        <h2 class="mb-4">Nossa Frota (POO)</h2>
        <div class="row mb-5" id="cards-container">
        </div>

        <hr>
        <h3 class="mt-5 mb-3">Cadastrar Novo Carro</h3>
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body text-start">
                        <div class="mb-3">
                            <label for="marcaCarro" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marcaCarro" placeholder="Ex: Toyota">
                        </div>
                        <div class="mb-3">
                            <label for="modeloCarro" class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modeloCarro" placeholder="Ex: Corolla">
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-success" onclick="cadastrarCarro()">Cadastrar Carro</button>
                        </div>
                    </div>
                </div>
            </div>    
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
